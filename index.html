<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Scanner Entrata — Firenze Rugby Subacqueo</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --blu:     #0d1b35;
    --blu2:    #1a2a4a;
    --arancio: #e8511a;
    --verde:   #2dc653;
    --rosso:   #e63946;
    --giallo:  #f4a261;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--blu);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, var(--blu) 0%, var(--blu2) 60%, #2a1808 100%);
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid var(--arancio);
  }
  header img { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
  header .titolo h1 { font-size: 13px; font-weight: 800; line-height: 1.2; }
  header .titolo p { font-size: 10px; color: var(--arancio); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .tabs { display: flex; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.08); }
  .tab {
    flex: 1; padding: 11px 6px; text-align: center; cursor: pointer;
    font-size: 12px; font-weight: 700; border: none; background: transparent;
    color: rgba(255,255,255,0.45); transition: all 0.2s; letter-spacing: 0.5px;
  }
  .tab.active { color: white; background: rgba(232,81,26,0.15); border-bottom: 3px solid var(--arancio); }
  .page { display: none; flex: 1; flex-direction: column; padding: 14px; gap: 12px; }
  .page.active { display: flex; }
  #reader {
    width: 100%; border-radius: 14px; overflow: hidden; background: #000;
    aspect-ratio: 1; max-width: 380px; margin: 0 auto;
    border: 3px solid var(--arancio);
    box-shadow: 0 0 0 1px rgba(232,81,26,0.3), 0 8px 32px rgba(0,0,0,0.5);
  }
  #reader img { display: none !important; }
  .result-box {
    border-radius: 14px; padding: 20px 16px;
    text-align: center; display: none; animation: pop 0.25s ease;
  }
  @keyframes pop {
    from { transform: scale(0.88); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }
  .result-box.ok        { background: var(--verde);  display: block; }
  .result-box.duplicato { background: var(--giallo); color: #1a1a1a; display: block; }
  .result-box.errore    { background: var(--rosso);  display: block; }
  .result-box .icona { font-size: 38px; margin-bottom: 8px; font-weight: 900; }
  .result-box .nome  { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .result-box .info  { font-size: 13px; opacity: 0.9; }
  .btn-scan {
    background: var(--arancio); color: white; border: none;
    border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 800;
    cursor: pointer; width: 100%; letter-spacing: 0.5px;
    box-shadow: 0 4px 16px rgba(232,81,26,0.4); transition: opacity 0.15s;
  }
  .btn-scan:active { opacity: 0.8; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat-card {
    background: rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 8px;
    text-align: center; border: 1px solid rgba(255,255,255,0.08);
  }
  .stat-card .num { font-size: 26px; font-weight: 800; }
  .stat-card .lbl { font-size: 10px; opacity: 0.6; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card.verde .num { color: var(--verde); }
  .stat-card.arancio .num { color: var(--arancio); }
  .search-box {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; padding: 11px 14px; color: white; font-size: 14px; width: 100%; outline: none;
  }
  .search-box::placeholder { color: rgba(255,255,255,0.4); }
  .lista-scroll { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .persona-card {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 11px; padding: 11px 13px; display: flex; align-items: center; gap: 11px;
  }
  .persona-card.entrato { border-left: 3px solid var(--verde); background: rgba(45,198,83,0.08); }
  .persona-card .badge {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; background: rgba(255,255,255,0.1); font-weight: 900;
  }
  .persona-card.entrato .badge { background: rgba(45,198,83,0.25); color: var(--verde); }
  .persona-card .dati { flex: 1; overflow: hidden; }
  .persona-card .pnome { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .persona-card .pturno { font-size: 11px; opacity: 0.55; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { font-size: 10px; padding: 3px 9px; border-radius: 20px; font-weight: 700; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .chip.si { background: var(--verde); color: white; }
  .chip.no { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.6); }
  .btn-refresh {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; color: white; padding: 11px; font-size: 13px;
    cursor: pointer; font-weight: 700; width: 100%;
  }
  .loading { text-align: center; padding: 40px; opacity: 0.5; font-size: 13px; }
  .setting-label { font-size: 12px; opacity: 0.7; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
  .setting-input {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px; padding: 12px 14px; color: white; font-size: 13px; width: 100%; outline: none;
  }
  .setting-input::placeholder { color: rgba(255,255,255,0.3); }
  .btn-salva {
    background: var(--arancio); border: none; border-radius: 10px; color: white;
    padding: 14px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%;
    box-shadow: 0 4px 16px rgba(232,81,26,0.35);
  }
  .msg-salvato { text-align: center; font-size: 13px; color: var(--verde); display: none; font-weight: 700; }
  .istruzioni {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px; font-size: 12px; line-height: 1.8; opacity: 0.85;
  }
  .istruzioni b { color: var(--arancio); }
</style>
</head>

    <div class="icona" id="res-stato"></div>
    <div class="nome" id="res-nome"></div>
    <div class="info" id="res-info"></div>
  </div>
  <button class="btn-scan" id="btn-scan" onclick="toggleScanner()">AVVIA SCANNER</button>
</div>

<div id="tab-lista" class="page">
  <div class="stats">
    <div class="stat-card"><div class="num" id="stat-tot">-</div><div class="lbl">Iscritti</div></div>
    <div class="stat-card verde"><div class="num" id="stat-ent">-</div><div class="lbl">Entrati</div></div>
    <div class="stat-card arancio"><div class="num" id="stat-att">-</div><div class="lbl">Attesa</div></div>
  </div>
  <input class="search-box" type="search" placeholder="Cerca nome..." oninput="filtraLista(this.value)">
  <div class="lista-scroll" id="lista-container">
    <div class="loading">Apri questa scheda per caricare</div>
  </div>
  <button class="btn-refresh" onclick="caricaLista()">AGGIORNA LISTA</button>
</div>

<div id="tab-impostazioni" class="page">
  <div class="istruzioni">
    <b>Config: Apps Script </b><br>
    Incollare il link per la connessione <br>
  </div>
  <div>
    <label class="setting-label">URL Web App (Apps Script)</label>
    <input class="setting-input" type="url" id="webapp-url" placeholder="https://script.google.com/macros/s/XXXXX/exec">
  </div>
  <button class="btn-salva" onclick="salvaConfig()">SALVA</button>
  <div class="msg-salvato" id="msg-salvato">Salvato!</div>
</div>

<script>
let scanner = null, scannerAttivo = false, listaPersone = [];
let urlWebApp = localStorage.getItem("webapp_url") || "";
document.getElementById("webapp-url").value = urlWebApp;

function switchTab(nome) {
  document.querySelectorAll(".tab").forEach((t,i) => t.classList.toggle("active", ["scanner","lista","impostazioni"][i]===nome));
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("tab-"+nome).classList.add("active");
  if (nome==="lista" && listaPersone.length===0) caricaLista();
}

function toggleScanner() {
  if (!urlWebApp) { alert("Prima configura l'URL nella scheda CONFIG"); switchTab("impostazioni"); return; }
  scannerAttivo ? fermaScanner() : avviaScanner();
}

function avviaScanner() {
  document.getElementById("btn-scan").textContent = "FERMA SCANNER";
  scannerAttivo = true; nascondiRisultato();
  scanner = new Html5Qrcode("reader");
  scanner.start({facingMode:"environment"}, {fps:10, qrbox:{width:240,height:240}}, onQrScanSuccess, ()=>{})
    .catch(err => { alert("Fotocamera non accessibile: "+err); fermaScanner(); });
}

function fermaScanner() {
  if (scanner) scanner.stop().then(()=>{ scanner=null; });
  document.getElementById("btn-scan").textContent = "AVVIA SCANNER";
  scannerAttivo = false;
}

async function onQrScanSuccess(id) {
  fermaScanner();
  if (navigator.vibrate) navigator.vibrate(80);
  const box = document.getElementById("result-box");
  box.className = "result-box ok"; box.style.display = "block";
  document.getElementById("res-stato").textContent = "...";
  document.getElementById("res-nome").textContent = "Verifica in corso";
  document.getElementById("res-info").textContent = "";
  try {
    const res = await fetch(urlWebApp+"?action=verify&id="+encodeURIComponent(id));
    const d = await res.json();
    if (!d.ok) mostraRisultato("errore","X","QR non valido", d.msg||"");
    else if (d.duplicato) mostraRisultato("duplicato","!",d.nome,"QR gia usato — "+d.turno);
    else {
      mostraRisultato("ok","OK",d.nome, d.turno+(d.disciplina?" · "+d.disciplina:""));
      if (navigator.vibrate) navigator.vibrate([80,40,80]);
    }
  } catch(e) { mostraRisultato("errore","X","Errore connessione","Controlla internet"); }
  setTimeout(()=>{ nascondiRisultato(); avviaScanner(); }, 3000);
}

function mostraRisultato(tipo, stato, nome, info) {
  const box = document.getElementById("result-box");
  box.className = "result-box "+tipo;
  document.getElementById("res-stato").textContent = stato;
  document.getElementById("res-nome").textContent = nome;
  document.getElementById("res-info").textContent = info;
}
function nascondiRisultato() { document.getElementById("result-box").style.display = "none"; }

async function caricaLista() {
  if (!urlWebApp) { document.getElementById("lista-container").innerHTML='<div class="loading">Configura prima URL in CONFIG</div>'; return; }
  document.getElementById("lista-container").innerHTML='<div class="loading">Caricamento...</div>';
  try {
    const res = await fetch(urlWebApp+"?action=list");
    listaPersone = await res.json();
    renderLista(listaPersone);
  } catch(e) { document.getElementById("lista-container").innerHTML='<div class="loading">Errore. Controlla connessione.</div>'; }
}

function renderLista(persone) {
  const entrati = persone.filter(p=>p.verificato).length;
  document.getElementById("stat-tot").textContent = persone.length;
  document.getElementById("stat-ent").textContent = entrati;
  document.getElementById("stat-att").textContent = persone.length - entrati;
  if (!persone.length) { document.getElementById("lista-container").innerHTML='<div class="loading">Nessuna iscrizione ancora</div>'; return; }
  const sorted = [...persone].sort((a,b)=>a.verificato-b.verificato);
  document.getElementById("lista-container").innerHTML = sorted.map(p=>`
    <div class="persona-card ${p.verificato?"entrato":""}">
      <div class="badge">${p.verificato?"✓":"○"}</div>
      <div class="dati">
        <div class="pnome">${p.nome||"—"}</div>
        <div class="pturno">${p.turno||""}${p.disciplina?" · "+p.disciplina:""}</div>
      </div>
      <span class="chip ${p.verificato?"si":"no"}">${p.verificato?"Entrato":"Attesa"}</span>
    </div>
  `).join("");
}

function filtraLista(t) {
  renderLista(listaPersone.filter(p=>(p.nome||"").toLowerCase().includes(t.toLowerCase())));
}

function salvaConfig() {
  const url = document.getElementById("webapp-url").value.trim();
  localStorage.setItem("webapp_url", url); urlWebApp = url;
  const msg = document.getElementById("msg-salvato");
  msg.style.display="block"; setTimeout(()=>msg.style.display="none", 2000);
}
</script>
</body>
</html>
